<div class="container text-center p-5">
  <h2 class="mb-4 text-primary">Générer un voyage</h2>

  <img
    src="https://www.aix-marseille.vitalspa.fr/wp-content/uploads/2022/10/jgtgnn.jpg"
    alt="Image du voyage"
    class="img-fluid mb-4 rounded-3"
  />

  <button
    class="btn btn-lg btn-outline-primary px-4 py-2 shadow-sm mb-4"
    (click)="generateVoyage()"
  >
    Générer
  </button>

  <div class="card mt-4 p-4 shadow-lg rounded-3">
    <h3 class="text-primary mb-3">{{ generatedVoyage.destination }}</h3>
    <p class="text-muted mb-3">{{ generatedVoyage.description }}</p>

    <div class="d-flex justify-content-between align-items-center">
      <span class="badge bg-success fs-5">
        💰 {{ generatedVoyage.prix | currency : "EUR" }}
      </span>

      @if (generatedVoyage.destination !== 'TROP RICHE ?') {
      <button
        class="btn btn-success px-4 py-2 shadow-sm rounded-2"
        data-bs-toggle="modal"
        [attr.data-bs-target]="'#confirmValidate' + generatedVoyage.id"
      >
        <i class="bi bi-check-circle"></i> Valider
      </button>
      }
    </div>
  </div>
</div>

<app-modal
  [modalId]="'confirmValidate' + generatedVoyage.id"
  [title]="'Valider le voyage'"
  [message]="'Êtes-vous sûr de vouloir valider ce voyage ?'"
  [confirmText]="'Valider'"
  [cancelText]="'Annuler'"
  (confirmed)="confirmVoyage()"
></app-modal>
