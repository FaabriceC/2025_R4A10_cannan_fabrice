<div class="voyage-detail container p-5">
  <div class="card shadow-lg p-5">
    <div class="row g-0 justify-content-center p-5">
      <div class="col-md-8">
        <div class="card-body">
          <img
            src="{{ imageUrl }}"
            alt="{{ voyage.destination }}"
            class="card-img-top mb-4 rounded-3 cursor-pointer"
          />

          <h2 class="card-title text-center">{{ voyage.destination }}</h2>

          <p class="card-text text-muted">{{ voyage.description }}...</p>

          <p class="card-text">
            <strong>Prix:</strong> {{ voyage.prix | currency : "EUR" }}
          </p>

          <button
            class="btn btn-danger w-100 mt-3"
            data-bs-toggle="modal"
            [attr.data-bs-target]="'#confirmDelete' + voyage.id"
          >
            Supprimer ce voyage
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-modal
  [modalId]="'confirmDelete' + voyage.id"
  [title]="'Supprimer le voyage'"
  [message]="'Êtes-vous sûr de vouloir supprimer ce voyage ?'"
  [confirmText]="'Supprimer'"
  [cancelText]="'Annuler'"
  (confirmed)="deleteVoyage()"
>
</app-modal>
